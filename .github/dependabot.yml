---
version: 2

# Minor and patch updates are grouped into one pull request per ecosystem.
# Major updates get their own pull requests.
# .github/workflows/dependabot-auto-merge.yml merges minor and patch updates after CI passes.

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
    groups:
      pip-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /.devcontainer
      - /molecule/default
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
    groups:
      pre-commit-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
