---
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: east-bench-pi-1
    image: raspberry-pi-manager-molecule:trixie
    dockerfile: Dockerfile
    pre_build_image: false
    command: /lib/systemd/systemd
    cgroupns_mode: host
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    groups:
      - raspberry_pis
      - pi5
provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/collections
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
  inventory:
    links:
      group_vars: ../../inventory/group_vars/
      host_vars: host_vars/
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
