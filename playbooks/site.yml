---
- name: Configure the Raspberry Pis
  hosts: raspberry_pis
  become: true
  pre_tasks:
    - name: Check the settings
      ansible.builtin.import_tasks: tasks/check-settings.yml

    - name: Read the kernel command line
      ansible.builtin.slurp:
        src: /proc/cmdline
      register: site_cmdline

    - name: Check that the Pi is unlocked
      ansible.builtin.assert:
        that:
          - "'overlayroot=tmpfs' not in (site_cmdline.content | b64decode)"
        fail_msg: "{{ inventory_hostname }} is locked. Unlock it before running this playbook."
        quiet: true

  roles:
    - base
    - network
    - pi_config
    - desktop
    - kiosk
    - readonly_os
