---
- name: Configure the Raspberry Pis
  hosts: raspberry_pis
  become: true
  pre_tasks:
    - name: Read the hardware model
      ansible.builtin.slurp:
        src: /proc/device-tree/model
      register: site_model

    - name: Check the hardware model
      ansible.builtin.assert:
        that:
          - site_model.content | b64decode | regex_replace('\x00', '') is match(device_model_pattern)
        fail_msg: "{{ inventory_hostname }} is not a device that matches '{{ device_model_pattern }}'."
        quiet: true

    - name: Read the kernel command line
      ansible.builtin.slurp:
        src: /proc/cmdline
      register: site_cmdline

    - name: Check that the Pi is unlocked
      ansible.builtin.assert:
        that:
          - "'overlayroot=tmpfs' not in (site_cmdline.content | b64decode)"
        fail_msg: "{{ inventory_hostname }} is locked. Unlock it before running this playbook."
        quiet: true
