---
- name: Install overlayroot
  ansible.builtin.include_tasks: main.yml
  when: not ansible_check_mode

- name: Read the lock state
  ansible.builtin.include_tasks: status.yml

# Set once, so the steps after the reboot still run when the lock state changes.
- name: Record whether the Pi needs locking
  ansible.builtin.set_fact:
    readonly_os_lock_needed: "{{ not readonly_os_overlay_active }}"

- name: Lock the Pi
  when: readonly_os_lock_needed
  block:
    - name: Select the kiosk session
      ansible.builtin.include_role:
        name: kiosk
        tasks_from: session
      vars:
        kiosk_session_active: true

    - name: Stop the display manager
      ansible.builtin.systemd_service:
        name: lightdm
        state: stopped

    # Removes any SSH authorized keys when the root file system is writable, to prevent them from persisting in the file system.
    - name: Find SSH authorized keys
      ansible.builtin.find:
        paths:
          - /root
          - /home
        patterns:
          - authorized_keys
          - authorized_keys2
        recurse: true
        depth: 3
        hidden: true
      register: readonly_os_authorized_keys

    - name: Remove SSH authorized keys
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ readonly_os_authorized_keys.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Make the boot partition read-only at boot
      ansible.builtin.command:
        cmd: raspi-config nonint enable_bootro
      when: not readonly_os_bootro_configured
      changed_when: true

    - name: Enable the overlay file system
      ansible.builtin.command:
        cmd: raspi-config nonint enable_overlayfs
      when: not readonly_os_overlay_configured
      changed_when: true

    - name: Reboot into the locked state
      ansible.builtin.reboot:
        reboot_timeout: "{{ readonly_os_reboot_timeout }}"

    - name: Read the new lock state
      ansible.builtin.include_tasks: status.yml

    - name: Check that the Pi is locked
      ansible.builtin.assert:
        that:
          - readonly_os_locked
        fail_msg: "{{ inventory_hostname }} did not lock."
        quiet: true
