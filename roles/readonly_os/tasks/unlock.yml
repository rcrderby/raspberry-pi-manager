---
- name: Read the lock state
  ansible.builtin.include_tasks: status.yml

# Set once, so the steps after the reboot still run when the lock state changes.
- name: Record whether the overlay file system needs disabling
  ansible.builtin.set_fact:
    readonly_os_overlay_disable_needed: "{{ readonly_os_overlay_active or readonly_os_overlay_configured }}"

- name: Disable the overlay file system
  when: readonly_os_overlay_disable_needed
  block:
    - name: Disable the overlay file system at boot
      ansible.builtin.command:
        cmd: raspi-config nonint disable_overlayfs
      changed_when: true

    - name: Reboot without the overlay file system
      ansible.builtin.reboot:
        reboot_timeout: "{{ readonly_os_reboot_timeout }}"

    - name: Read the new lock state
      ansible.builtin.include_tasks: status.yml

- name: Make the boot partition writable at boot
  ansible.builtin.command:
    cmd: raspi-config nonint disable_bootro
  when: readonly_os_bootro_configured
  changed_when: true

- name: Make the boot partition writable now
  ansible.posix.mount:
    path: "{{ readonly_os_boot_dir }}"
    opts: rw
    state: remounted
  when: readonly_os_bootro_active

- name: Find the kiosk session
  ansible.builtin.command:
    cmd: pgrep --full "^/usr/bin/labwc --config-dir"
  register: readonly_os_kiosk_running
  changed_when: false
  failed_when: readonly_os_kiosk_running.rc > 1

- name: Select the desktop session
  ansible.builtin.include_role:
    name: kiosk
    tasks_from: session
  vars:
    kiosk_session_active: false

- name: Restart the display manager in the desktop session
  ansible.builtin.systemd_service:
    name: lightdm
    state: restarted
  when: readonly_os_kiosk_running.rc == 0

- name: Read the new lock state
  ansible.builtin.include_tasks: status.yml

- name: Check that the Pi is unlocked
  ansible.builtin.assert:
    that:
      - not readonly_os_overlay_active
      - not readonly_os_bootro_active
    fail_msg: "{{ inventory_hostname }} did not unlock."
    quiet: true
