---
argument_specs:
  main:
    short_description: Installs the packages that the overlay file system needs
    options: {}
  status:
    short_description: Reads the lock state
    description:
      - Sets readonly_os_overlay_active, readonly_os_overlay_configured, readonly_os_bootro_active, readonly_os_bootro_configured,
        and readonly_os_locked.
    options:
      readonly_os_boot_dir:
        type: str
        default: /boot/firmware
        description: Mount point of the boot partition.
  lock:
    short_description: Locks the Pi
    description:
      - Selects the kiosk session, stops the display manager so Chromium exits cleanly, removes and SSH authorized keys,
        makes the boot partition read-only, enables the overlay file system, and reboots.
      - While locked, no change to the file systems persists across a reboot.
    options:
      readonly_os_boot_dir:
        type: str
        default: /boot/firmware
        description: Mount point of the boot partition.
      readonly_os_reboot_timeout:
        type: int
        default: 600
        description: Seconds to wait for the Pi to return after a reboot.
  unlock:
    short_description: Unlocks the Pi
    description:
      - Disables the overlay file system, reboots, makes the boot partition writable, and selects the desktop session.
    options:
      readonly_os_boot_dir:
        type: str
        default: /boot/firmware
        description: Mount point of the boot partition.
      readonly_os_reboot_timeout:
        type: int
        default: 600
        description: Seconds to wait for the Pi to return after a reboot.
