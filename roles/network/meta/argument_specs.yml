---
argument_specs:
  main:
    short_description: Writes the Netplan file for the wired interface
    description:
      - The new configuration takes effect at the next reboot.
      - Fails if the change would replace the current address of the interface, unless network_allow_address_change is true.
    options:
      network_interface:
        type: str
        default: eth0
        description: Wired interface name.
      network_address:
        type: str
        required: true
        description: IPv4 address of the interface.
      network_prefix:
        type: int
        required: true
        description: IPv4 prefix length.
      network_gateway:
        type: str
        required: true
        description: IPv4 default gateway.
      network_nameservers:
        type: list
        elements: str
        default: []
        description: DNS server addresses.
      network_connection_uuid:
        type: str
        description:
          - UUID of the NetworkManager connection.
          - Defaults to a UUID derived from the host name and interface.
      network_netplan_file:
        type: str
        description:
          - Netplan file that holds the configuration, in the format NetworkManager writes. Other Netplan files are removed.
          - Defaults to /etc/netplan/90-NM-<network_connection_uuid>.yaml.
      network_allow_address_change:
        type: bool
        default: false
        description: Allow a change to the current address of the interface.
  cloud_init:
    short_description: Writes a cloud-init network-config file for each host on the control node
    options:
      network_interface:
        type: str
        default: eth0
        description: Wired interface name.
      network_address:
        type: str
        required: true
        description: IPv4 address of the interface.
      network_prefix:
        type: int
        required: true
        description: IPv4 prefix length.
      network_gateway:
        type: str
        required: true
        description: IPv4 default gateway.
      network_nameservers:
        type: list
        elements: str
        default: []
        description: DNS server addresses.
      network_cloud_init_dir:
        type: str
        description:
          - Directory that receives one <host>/network-config file per host.
          - Defaults to build/cloud-init in the repository.
