---
- name: Create the network-config directory
  ansible.builtin.file:
    path: "{{ network_cloud_init_dir }}/{{ inventory_hostname }}"
    state: directory
    mode: "0755"
  delegate_to: localhost

- name: Write network-config
  ansible.builtin.template:
    src: network-config.j2
    dest: "{{ network_cloud_init_dir }}/{{ inventory_hostname }}/network-config"
    mode: "0644"
  delegate_to: localhost
