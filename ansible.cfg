[defaults]
collections_path = ./collections
collections_scan_sys_path = false
inventory = ./inventory/hosts.yml
roles_path = ./roles
# Host keys are checked by the StrictHostKeyChecking option in ssh_args.
host_key_checking = false

[ssh_connection]
# accept-new saves the host key of a new host and refuses a changed host key.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = true
